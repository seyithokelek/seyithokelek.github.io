    Publications:
      - title: "Discovery of Six Low-z, High-luminosity, and High-mass Quasars"
        authors:
          - Hökelek, S.
          - Kaçan, E. S.
          - Ak, N. F.
        publisher: Publications of the Astronomical Society of the Pacific (PASP)
        releaseDate: 2024
        url: "https://doi.org/10.1088/1538-3873/ad8b6b"
        summary: "Volume 136(11), 114101. This study presents the discovery of six low-redshift quasars, identified through spectral observations conducted with the RTT-150 telescope. Our analysis includes detailed modeling of their continuum and emission line properties, which allowed us to estimate their bolometric luminosities, central black hole masses, and Eddington ratios."

      - title: "Quasars Discovered by RTT-150 TFOSC Spectral Observations"
        authors:
          - Hökelek, S.
          - Filiz Ak, N.
        publisher: Turkish Journal of Astronomy and Astrophysics (TJAA)
        releaseDate: 2022
        url: "https://doi.org/10.55064/tjaa.1037278"
        summary: "TJAA, 3(3), 6-9. This study presents the first spectroscopic observations of four quasar candidates. We select the quasar candidates considering the high candidacy probabilities calculated from the SDSS and WISE photometric colors. We obtained the long-slit spectrum of each candidate with RTT-150."

      - title: "Determining Redshift in Quasars: zFinder"
        authors:
          - Kaçan, E. S.
          - Hökelek, S.
          - Filiz Ak, N.
        publisher: Turkish Journal of Astronomy and Astrophysics (TJAA)
        releaseDate: 2022
        url: "https://doi.org/10.55064/tjaa.1037276"
        summary: "TJAA, 3(3), 27-32. This study presents the algorithm and the test results for the zFinder pipeline code that is developed to measure the redshift (z) of the quasar spectra."

      - title: "Quasar Wind Variability Prediction with Machine Learning Methods"
        authors:
          - Hökelek, S.
          - Filiz Ak, N.
        publisher: Turkish Journal of Astronomy and Astrophysics (TJAA)
        releaseDate: 2023
        url: "https://doi.org/10.55064/tjaa.1203799"
        summary: "TJAA, 4(3), 195-198. Approximately 20% of the quasars exhibit the Broad Absorption Lines (BALs) as a tracer of the outflows from the accretion disk of the central supermassive black holes."

      - title: "AGN Studies of TUG-SRG Collaboration"
        authors:
          - Filiz Ak, N.
          - Hökelek, S.
          - Boztepe, T.
          - et al.
        publisher: Turkish Journal of Astronomy and Astrophysics (TJAA)
        releaseDate: 2023
        url: "https://doi.org/10.55064/tjaa.1203755"
        summary: "TJAA, 4(3), 192-198. Active member of the joint Turkish-Russian AGN follow-up program using RTT-150 and SRG/eROSITA data."

      - title: "Modeling Blazar TEDs with Simple Regression"
        authors:
          - Utku, B.
          - Filiz Ak, N.
          - Hökelek, S.
        publisher: Turkish Journal of Astronomy and Astrophysics (TJAA)
        releaseDate: 2025
        url: "https://doi.org/10.55064/tjaa.1593725"
        summary: "TJAA, 6(Special Issue), 198-203. Blazars are a subclass of active galactic nuclei characterized by jet structures oriented perpendicular to the accretion disk surrounding the central black hole."

      - title: "Bayesian Radial Velocity Solver: BRaVe"
        authors:
          - Barbaros, E.
          - Hökelek, S.
          - Ak, H.
          - Filiz Ak, N.
        publisher: Turkish Journal of Astronomy and Astrophysics (TJAA)
        releaseDate: 2025
        url: "https://doi.org/10.55064/tjaa.1598320"
        summary: "TJAA, 6(Special Issue), 338-343. The analysis of the time-dependent radial velocity curves of double stars allows direct determination of the physical parameters of the components. The program BRaVe obtains orbital parameters and errors with high precision."

      - title: "Spectral Verification of 6 Low-z Quasars with RTT-150"
        authors:
          - Hökelek, S.
          - Kacan, E. S.
          - Filiz Ak, N.
        publisher: Turkish Journal of Astronomy and Astrophysics (TJAA)
        releaseDate: 2025
        url: "https://doi.org/10.55064/tjaa.1632477"
        summary: "TJAA, 6(Special Issue), 194-197. This paper presents the discovery of 6 quasars that have been spectrally confirmed for the first time using the RTT-150 telescope and the TFOSC spectrometer."

